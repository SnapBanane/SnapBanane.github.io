<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- the hero's horizon with the orange SSL ball rising over it -->
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
    <radialGradient id="glow" cx="32" cy="36" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffce9f" stop-opacity=".7"/>
      <stop offset=".45" stop-color="#ff8a3d" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx="26" cy="26" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb47a"/>
      <stop offset="1" stop-color="#f2701f"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#0e0e0d"/>
    <rect width="64" height="64" fill="url(#glow)"/>
    <circle cx="32" cy="34" r="15" fill="url(#ball)"/>
    <!-- planet below the horizon hides the ball's lower part -->
    <path d="M-4 49 Q32 26 68 49 V70 H-4 Z" fill="#0e0e0d"/>
    <path d="M-4 49 Q32 26 68 49" fill="none" stroke="#7a68ff" stroke-width="5" stroke-opacity=".45"/>
    <path d="M-4 49 Q32 26 68 49" fill="none" stroke="#f5f2ea" stroke-width="2"/>
  </g>
</svg>
